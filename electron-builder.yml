appId: pt.estudo.offline
productName: Caderno de Estudo
directories:
  output: release
files:
  - desktop/**
  - lib/**
  - scripts/product.mjs
  - web/**
  - package.json
asar: true
win:
  icon: web/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: CadernoDeEstudo-${version}-Windows-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Education
  artifactName: CadernoDeEstudo-${version}-Linux-${arch}.${ext}
# Imagens em build/, geradas por scripts/installer-art.mjs.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Caderno
  uninstallDisplayName: Caderno
  runAfterFinish: true
  installerLanguages: [pt_PT]
  language: "2070"
  installerIcon: web/icon.ico
  uninstallerIcon: web/icon.ico
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
# Sem canal de atualizações automáticas neste fork (o do projeto original não deve ser usado).
